<!DOCTYPE html>
<html>
<body>
<script>
// Attempt to access file system locations
window.location.href = 'file:///Applications/';
setTimeout(() => {
    window.location.href = 'file:///Users/Shared/';
}, 100);
setTimeout(() => {
    window.location.href = 'file:///System/Library/CoreServices/';
}, 200);
setTimeout(() => {
    window.location.href = 'file:///etc/passwd';
}, 300);
</script>
</body>
</html>
